# overrides/neowx-material-skin.conf — partial NeoWX Material skin.conf,
# deep-merged onto /etc/weewx/skins/neowx-material/skin.conf by
# feature-neowx-material.
#
# This is a ConfigObj/INI file in the SAME format as the skin's own
# skin.conf. Only list the sections and keys you want to change —
# anything you don't mention keeps whatever the extension shipped.
# Nested sections ([[...]], [[[...]]]) merge recursively.
#
# The skin's language is NOT set here — that's the install-critical
# NEOWX_LANG key on the Edit Configuration screen (it lands in
# weewx.conf, not skin.conf). Use THIS file for the skin's [Extras]
# settings: colour scheme, navigation, footer, MQTT, forecast, charts,
# card ordering, custom embeds, etc.
#
# An empty / all-comments file (like this default) is a no-op — the
# feature detects there's nothing to merge and skips the step.
#
# Full option reference: the comments in the skin's own skin.conf, and
# https://github.com/seehase/neowx-material
#
# ---------------------------------------------------------------------------
# Examples (uncomment + adapt):
# ---------------------------------------------------------------------------
#
# Pick a Material colour scheme and tidy the footer:
#
# [Extras]
#     [[Appearance]]
#         color = blue
#     [[Footer]]
#         name = "My Weather Station"
#
# Enable the 7-day Open-Meteo forecast card (uses the station's
# lat/lon from weewx.conf unless you override here):
#
# [Extras]
#     [[Forecast]]
#         days = 7
#         show_icon = yes
#         variables = temperature, precipitation, wind, sun
#
# Enable real-time MQTT updates (see the skin's MQTT.md for the broker
# side):
#
# [Extras]
#     [[MQTT]]
#         enabled = true
#         host = your-mqtt-broker.lan
#         port = 9001
#         topic = "weewx/#"
#         flash_on_update = true
