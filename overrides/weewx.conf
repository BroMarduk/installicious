# overrides/weewx.conf — partial weewx.conf, deep-merged onto the
# apt-installed /etc/weewx/weewx.conf by feature-weewx-setup.
#
# This is a ConfigObj/INI file in the SAME format as weewx.conf itself.
# Only list the sections and keys you want to change — anything you don't
# mention keeps whatever the weewx package + `weectl station reconfigure`
# produced. Nested sections ([[...]], [[[...]]]) merge recursively.
#
# The basics — station location, lat/lon, altitude, units, station type,
# registry opt-in — are NOT set here. Those are the install-critical
# settings and live on the in-menu Edit Configuration screen as the
# WEEWX_STATION_* keys (see config/weewx.config). Use THIS file for the
# long tail: report skins, RESTful uploaders, logging, retention, custom
# service lists, driver-specific sections, etc.
#
# An empty / all-comments file (like this default) is a no-op — the
# feature detects there's nothing to merge and skips the step.
#
# ---------------------------------------------------------------------------
# Examples (uncomment + adapt):
# ---------------------------------------------------------------------------
#
# Turn the default Seasons report off and enable a custom skin instead:
#
# [StdReport]
#     [[SeasonsReport]]
#         enable = false
#     [[MyReport]]
#         skin = MySkin
#         enable = true
#
# Disable the Weather Underground uploader that ships enabled-but-blank:
#
# [StdRESTful]
#     [[Wunderground]]
#         enable = false
#
# Quieten the logs to warnings and above:
#
# [Logging]
#     [[root]]
#         level = WARNING
