<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Construction</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px; font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at 20% 25%,rgba(255,255,255,.1),transparent 24%),radial-gradient(circle at 72% 65%,rgba(96,165,250,.24),transparent 30%),linear-gradient(135deg,#030407,#090b12 48%,#030407); color:#f8fafc; }
    .shell { width:min(860px,100%); min-height:500px; display:grid; align-content:center; padding:64px; border-radius:36px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.055); box-shadow:0 28px 80px rgba(0,0,0,.52); }
    .status { width:fit-content; padding:10px 14px; border-radius:16px; background:rgba(255,255,255,.08); color:#bfdbfe; font-size:14px; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:24px 0 18px; max-width:680px; font-size:clamp(44px,8vw,88px); line-height:.94; letter-spacing:-.07em; font-weight:750; }
    .copy { max-width:580px; color:#bcc7d8; font-size:19px; line-height:1.65; }
    .bar { margin-top:42px; height:10px; width:min(440px,100%); border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; }
    .bar span { display:block; width:64%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#93c5fd,#e0f2fe); }
    @media (max-width:640px){ .shell{padding:36px;border-radius:26px;} }
  </style>
</head>
<body>
  <section class="shell">
    <div class="status">Maintenance window</div>
    <h1>Quietly rebuilding the experience.</h1>
    <p class="copy">The site is temporarily offline while we finish updates. Thanks for your patience while the final pieces are put in place.</p>
    <div class="bar" aria-label="Progress indicator"><span></span></div>
  </section>
</body>
</html>
