<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Construction</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#f8fafc; background:radial-gradient(circle at 15% 25%,rgba(148,163,184,.35) 0 1px,transparent 2px),radial-gradient(circle at 78% 18%,rgba(226,232,240,.45) 0 1px,transparent 2px),radial-gradient(circle at 65% 78%,rgba(148,163,184,.35) 0 1px,transparent 2px),radial-gradient(circle at 38% 62%,rgba(226,232,240,.35) 0 1px,transparent 2px),radial-gradient(circle at 50% 35%,rgba(79,70,229,.22),transparent 36%),#020617; }
    .card { width:min(780px,100%); padding:56px; border-radius:34px; border:1px solid rgba(148,163,184,.22); background:linear-gradient(180deg,rgba(15,23,42,.86),rgba(2,6,23,.86)); box-shadow:0 30px 90px rgba(0,0,0,.58); }
    .orbit { width:76px; height:76px; border:1px solid rgba(165,180,252,.42); border-radius:50%; display:grid; place-items:center; margin-bottom:30px; }
    .planet { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#818cf8,#e0e7ff); box-shadow:0 0 34px rgba(129,140,248,.35); }
    h1 { margin:0 0 18px; font-size:clamp(42px,7vw,82px); line-height:.96; letter-spacing:-.065em; }
    p { margin:0; max-width:580px; color:#a8b0c2; font-size:18px; line-height:1.7; }
    .footer { margin-top:40px; display:flex; align-items:center; gap:12px; color:#c7d2fe; font-size:14px; letter-spacing:.14em; text-transform:uppercase; }
    .rule { width:48px; height:1px; background:#818cf8; }
    @media (max-width:640px){ .card{padding:34px;} }
  </style>
</head>
<body>
  <main class="card">
    <div class="orbit"><div class="planet"></div></div>
    <h1>Preparing for launch.</h1>
    <p>Our website is under construction while we align the final systems and get everything ready for a smooth arrival.</p>
    <div class="footer"><span class="rule"></span><span>Coming soon</span></div>
  </main>
</body>
</html>
