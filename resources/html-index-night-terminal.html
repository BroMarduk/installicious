<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Under Construction</title>
  <style>
    :root { --bg: #070b12; --panel: #0e1624; --text: #e5edf7; --muted: #8fa3bc; --accent: #61dafb; --green: #51d88a; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(97,218,251,.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(81,216,138,.12), transparent 34%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .shell {
      width: min(860px, 100%);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
      overflow: hidden;
    }
    .bar { display: flex; gap: 8px; align-items: center; height: 48px; padding: 0 18px; background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.08); }
    .light { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
    .light:nth-child(2) { background: #ffbd2e; }
    .light:nth-child(3) { background: #28c840; }
    main { padding: clamp(34px, 7vw, 72px); }
    .prompt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--green); font-size: 15px; margin-bottom: 26px; }
    h1 { margin: 0; font-size: clamp(44px, 8vw, 86px); line-height: .94; letter-spacing: -.06em; }
    p { margin: 22px 0 0; max-width: 620px; color: var(--muted); font-size: clamp(17px, 2vw, 21px); line-height: 1.65; }
    .progress { margin-top: 42px; height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
    .progress span { display: block; width: 68%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: inherit; }
    .meta { margin-top: 14px; display: flex; justify-content: space-between; gap: 16px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  </style>
</head>
<body>
  <section class="shell">
    <div class="bar"><span class="light"></span><span class="light"></span><span class="light"></span></div>
    <main>
      <div class="prompt">$ deploy --site refresh --status active</div>
      <h1>We&rsquo;re compiling a better site.</h1>
      <p>A few upgrades are being installed behind the scenes. We&rsquo;ll be back online shortly.</p>
      <div class="progress"><span></span></div>
      <div class="meta"><span>build: in-progress</span><span>status: stable</span></div>
    </main>
  </section>
</body>
</html>
