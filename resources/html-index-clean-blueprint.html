<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Construction</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --line:#dce3ee; --accent:#f59e0b; --paper:#f8fafc; }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:var(--paper); }
    .page { min-height:100%; display:flex; align-items:center; justify-content:center; padding:32px; background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:42px 42px; }
    .card { width:min(760px, 100%); background:#fff; border:1px solid #e5e7eb; border-radius:24px; padding:56px; box-shadow:0 24px 60px rgba(15,23,42,.12); }
    .eyebrow { display:inline-block; padding:10px 14px; border-radius:999px; background:#fff7ed; color:#9a3412; font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:28px 0 16px; font-size:clamp(44px, 7vw, 78px); line-height:.98; letter-spacing:-.06em; }
    p { margin:0; max-width:560px; color:var(--muted); font-size:20px; line-height:1.55; }
    .footer { display:flex; gap:12px; align-items:center; margin-top:36px; color:#475467; font-size:15px; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); }
    @media (max-width:600px) { .card { padding:34px; } p { font-size:18px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Under construction notice">
      <span class="eyebrow">Site update in progress</span>
      <h1>Building<br>something<br>better.</h1>
      <p>Our website is getting a clean new finish. Check back soon for a smoother, sharper experience.</p>
      <div class="footer"><span class="dot"></span><span>Launching soon</span></div>
    </section>
  </main>
</body>
</html>
