<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Construction</title>
  <style>
    :root { --ink:#101828; --muted:#667085; --purple:#6d5dfc; --orange:#ff7a3d; }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; font-family:Arial, Helvetica, sans-serif; background:#f9fafb; color:var(--ink); }
    .page { min-height:100%; display:flex; align-items:center; justify-content:center; padding:32px; }
    .shell { width:min(980px, 100%); min-height:560px; display:grid; grid-template-columns:1.05fr .95fr; overflow:hidden; border-radius:30px; background:#fff; box-shadow:0 26px 70px rgba(15,23,42,.15); }
    .copy { padding:70px; }
    .visual { display:grid; place-items:center; background:linear-gradient(135deg, var(--purple), var(--orange)); color:white; }
    .shape { width:230px; height:230px; border:10px solid rgba(255,255,255,.8); border-radius:38px; transform:rotate(12deg); }
    .eyebrow { display:inline-block; padding:10px 14px; border-radius:999px; background:#eef2ff; color:#5145cd; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:30px 0 18px; font-size:clamp(38px, 5vw, 62px); line-height:1; letter-spacing:-.045em; }
    p { margin:0; max-width:460px; color:var(--muted); font-size:20px; line-height:1.55; }
    strong { display:block; margin-top:34px; font-size:22px; }
    @media (max-width:760px) { .shell { grid-template-columns:1fr; } .visual { min-height:220px; } .copy { padding:42px; } .shape { width:150px; height:150px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="shell" aria-label="Under construction notice">
      <div class="copy">
        <span class="eyebrow">Renovation mode</span>
        <h1>This page<br>is getting<br>an upgrade.</h1>
        <p>We’re refreshing the site structure, polish, and performance. Thanks for checking in.</p>
        <strong>Back shortly.</strong>
      </div>
      <div class="visual" aria-hidden="true"><div class="shape"></div></div>
    </section>
  </main>
</body>
</html>
