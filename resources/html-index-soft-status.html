<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Construction</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --blue:#4f8cff; }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:linear-gradient(135deg, #eef7ff, #fbf6ff); }
    .page { min-height:100%; display:flex; align-items:center; justify-content:center; padding:32px; }
    .card { width:min(760px, 100%); background:rgba(255,255,255,.92); border:1px solid rgba(255,255,255,.9); border-radius:32px; padding:58px; box-shadow:0 24px 70px rgba(79,140,255,.18); }
    .icon { width:74px; height:74px; border-radius:24px; display:grid; place-items:center; background:#fff; color:var(--blue); font-size:34px; box-shadow:0 14px 35px rgba(79,140,255,.15); }
    h1 { margin:34px 0 18px; font-size:clamp(38px, 6vw, 66px); line-height:.98; letter-spacing:-.055em; }
    p { margin:0; max-width:620px; color:var(--muted); font-size:20px; line-height:1.55; }
    .status { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-top:32px; }
    .item { border:1px solid #e8eef7; border-radius:18px; background:#fff; padding:18px; }
    .item b { display:block; margin-bottom:6px; }
    .item span { color:var(--muted); font-size:14px; }
    @media (max-width:680px) { .card { padding:38px; } .status { grid-template-columns:1fr; } p { font-size:18px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Under construction notice">
      <div class="icon">✦</div>
      <h1>Quietly<br>improving<br>things.</h1>
      <p>Our site is under construction while we make a few careful updates. Nothing dramatic — just a better experience taking shape.</p>
      <div class="status">
        <div class="item"><b>Design</b><span>Being polished</span></div>
        <div class="item"><b>Content</b><span>Being updated</span></div>
        <div class="item"><b>Launch</b><span>Coming soon</span></div>
      </div>
    </section>
  </main>
</body>
</html>
