<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Construction</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at 30% 25%, rgba(124, 58, 237, .18), transparent 34%),
        radial-gradient(circle at 74% 68%, rgba(34, 211, 238, .14), transparent 32%),
        linear-gradient(180deg, #090713 0%, #05040a 62%, #020106 100%);
    }

    .sign {
      width: min(820px, 100%);
      text-align: center;
      padding: 58px 46px;
      border-radius: 32px;
      background: rgba(6, 8, 20, .82);
      border: 1px solid rgba(148, 163, 184, .18);
      box-shadow:
        0 0 28px rgba(34, 211, 238, .08),
        0 0 42px rgba(124, 58, 237, .10),
        0 28px 90px rgba(0, 0, 0, .58);
      position: relative;
      overflow: hidden;
    }

    .sign::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 24px;
      border: 1px solid rgba(34, 211, 238, .34);
      box-shadow:
        0 0 10px rgba(34, 211, 238, .24),
        0 0 28px rgba(124, 58, 237, .18),
        inset 0 0 20px rgba(34, 211, 238, .06);
      pointer-events: none;
    }

    .sign::after {
      content: "";
      position: absolute;
      left: 22%;
      right: 22%;
      top: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(168, 85, 247, .85), rgba(34, 211, 238, .75), transparent);
      box-shadow:
        0 0 10px rgba(168, 85, 247, .5),
        0 0 16px rgba(34, 211, 238, .35);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .small {
      color: #a78bfa;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      text-shadow:
        0 0 8px rgba(167, 139, 250, .62),
        0 0 20px rgba(34, 211, 238, .16);
    }

    h1 {
      margin: 24px auto 20px;
      max-width: 720px;
      font-size: clamp(44px, 8vw, 88px);
      line-height: .95;
      letter-spacing: -.065em;
      color: #f8fafc;
      text-shadow:
        0 0 8px rgba(248, 250, 252, .22),
        0 0 20px rgba(34, 211, 238, .38),
        0 0 38px rgba(124, 58, 237, .28);
    }

    h1 span {
      color: #cffafe;
      text-shadow:
        0 0 10px rgba(34, 211, 238, .48),
        0 0 26px rgba(34, 211, 238, .32),
        0 0 42px rgba(168, 85, 247, .22);
    }

    p {
      margin: 0 auto;
      max-width: 560px;
      color: #a8b5c5;
      font-size: 18px;
      line-height: 1.7;
    }

    .divider {
      margin: 36px auto 0;
      width: 190px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #a78bfa, #22d3ee, transparent);
      box-shadow:
        0 0 10px rgba(34, 211, 238, .45),
        0 0 18px rgba(124, 58, 237, .35);
    }

    @media (max-width: 640px) {
      body {
        padding: 20px;
      }

      .sign {
        padding: 46px 28px;
        border-radius: 26px;
      }

      .sign::before {
        inset: 13px;
        border-radius: 18px;
      }

      .small {
        font-size: 12px;
        letter-spacing: .18em;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="sign">
    <div class="content">
      <div class="small">New site loading</div>
      <h1>Under <span>Construction</span></h1>
      <p>We’re tuning the final details and getting the next version ready for visitors.</p>
      <div class="divider"></div>
    </div>
  </main>
</body>
</html>
