<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Construction</title>
  <style>
    :root { --bg:#07090f; --panel:#101522; --line:rgba(130,160,255,.18); --text:#eff3ff; --muted:#9aa7c2; --accent:#8fb3ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),radial-gradient(circle at 30% 20%,rgba(93,136,255,.22),transparent 34%),radial-gradient(circle at 80% 75%,rgba(102,225,255,.12),transparent 32%),var(--bg); background-size:44px 44px,44px 44px,auto,auto,auto; padding:32px; }
    main { width:min(760px,100%); padding:56px; border:1px solid rgba(143,179,255,.24); border-radius:28px; background:rgba(16,21,34,.82); box-shadow:0 30px 90px rgba(0,0,0,.45); }
    .eyebrow { display:inline-flex; gap:10px; align-items:center; padding:8px 12px; border:1px solid rgba(143,179,255,.28); border-radius:999px; color:var(--accent); font-size:13px; letter-spacing:.18em; text-transform:uppercase; background:rgba(143,179,255,.08); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 18px var(--accent); }
    h1 { margin:28px 0 16px; font-size:clamp(42px,7vw,82px); line-height:.95; letter-spacing:-.06em; }
    p { margin:0; max-width:560px; color:var(--muted); font-size:18px; line-height:1.7; }
    .meta { margin-top:42px; display:flex; gap:14px; flex-wrap:wrap; }
    .pill { padding:11px 15px; border-radius:999px; color:#c9d5ef; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); font-size:14px; }
    @media (max-width:640px){ main{padding:34px;} }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot"></span> Build in progress</div>
    <h1>We’re crafting something new.</h1>
    <p>This site is currently under construction. A cleaner, faster, and more polished experience is being assembled behind the scenes.</p>
    <div class="meta"><span class="pill">Design refresh</span><span class="pill">Performance tuning</span><span class="pill">Launching soon</span></div>
  </main>
</body>
</html>
