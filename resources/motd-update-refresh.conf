// Refreshes /etc/motd.d/<MOTD_NAME>/results-updates after every apt /
// dpkg operation so the MOTD's "X Updates" line reflects the current
// upgradable count without waiting for the hourly cron tick.
//
// The path here MUST match the cron file install-motd-updates.sh drops
// into /etc/cron.hourly/ — no `.sh` extension so run-parts (which runs
// /etc/cron.hourly hourly) doesn't skip it.

DPkg::Post-Invoke {
  "/etc/cron.hourly/motd-current-updates >/dev/null 2>&1 &";
};

APT::Update::Post-Invoke-Success {
  "/etc/cron.hourly/motd-current-updates >/dev/null 2>&1 &";
};
