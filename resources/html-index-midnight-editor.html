<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Construction</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; background:#080b10; color:#e5eefb; }
    .window { width:min(900px,100%); border-radius:22px; overflow:hidden; border:1px solid #232b39; background:#0d1117; box-shadow:0 30px 90px rgba(0,0,0,.55); }
    .top { display:flex; align-items:center; gap:8px; height:46px; padding:0 18px; background:#111827; border-bottom:1px solid #232b39; }
    .circle { width:12px; height:12px; border-radius:50%; background:#374151; }
    .file { margin-left:12px; color:#94a3b8; font-size:13px; }
    .content { padding:44px; }
    .line { display:grid; grid-template-columns:34px 1fr; gap:18px; color:#64748b; font-size:16px; line-height:1.9; }
    .line span:last-child { color:#dbeafe; }
    .keyword { color:#93c5fd; } .string { color:#86efac; } .comment { color:#64748b; }
    h1 { margin:32px 0 14px; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:clamp(38px,6vw,72px); line-height:.98; letter-spacing:-.06em; color:#f8fafc; }
    p { margin:0; max-width:640px; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#9ca3af; font-size:18px; line-height:1.65; }
    @media (max-width:640px){ .content{padding:30px;} .line{grid-template-columns:24px 1fr; gap:12px; font-size:13px;} }
  </style>
</head>
<body>
  <main class="window">
    <div class="top"><span class="circle"></span><span class="circle"></span><span class="circle"></span><span class="file">site-status.html</span></div>
    <section class="content">
      <div class="line"><span>10</span><span><span class="keyword">const</span> status = <span class="string">"under construction"</span>;</span></div>
      <div class="line"><span>20</span><span><span class="keyword">const</span> launch = <span class="string">"soon"</span>;</span></div>
      <div class="line"><span>30</span><span><span class="comment">// polishing the final details</span></span></div>
      <h1>We’re editing the next release.</h1>
      <p>The current page is being replaced with something sharper, cleaner, and easier to use.</p>
    </section>
  </main>
</body>
</html>
